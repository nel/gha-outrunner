# Docker-only configuration.
# Build the runner image: docker build -t outrunner-runner runner/
url: https://github.com/your-org/your-repo
# token_file: /etc/outrunner/token

runners:
  linux:
    labels: [self-hosted, linux]
    docker:
      image: outrunner-runner:latest
      # Optional: container network mode. "host" lets jobs reach ports that
      # sibling containers (e.g. GitHub Actions services:) publish on the host.
      # network: host
      # Optional: user namespace mode. With rootless Podman, keep-id maps the
      # host user to the image's runner user (UID 1001 in actions-runner).
      # userns: keep-id:uid=1001,gid=1001
      # Optional: memory limit per runner container, in MiB.
      # memory: 2048
      # Optional: host devices and supplementary groups, e.g. for KVM in jobs.
      # devices: [/dev/kvm]
      # group_add: [keep-groups]
      # Optional: bind mount a host directory into every container.
      # Useful for a persistent build cache (e.g. vcpkg, cargo, gradle).
      # mounts:
      #   - source: /var/cache/vcpkg
      #     target: /opt/vcpkg-cache
      #   - source: /var/cache/cargo
      #     target: /opt/cargo-cache
      #     read_only: false
